name: "Tp1 - markov"

on:
  pull_request:
    branches:
      - main
      - master
jobs: 
  
  install:
    runs-on: ubuntu-latest
    steps: 
      - name: Clone Repo content 
        uses: actions/checkout@v6
        with:
          ref : master
          
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Cache 
        uses: actions/cache@v5
        with: 
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
  test: 
    runs-on: ubuntu-latest
    needs: install
    steps: 
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Unit Test
        run: npm test

  lint:
    runs-on: ubuntu-latest
    needs: install
    steps: 
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          
      - run: npm run lint